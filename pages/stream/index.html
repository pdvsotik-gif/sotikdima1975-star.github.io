<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стрим — СайтСотика</title>
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/welcome.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    /* Стили для стрима в духе проекта */
    .stream-intro {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 40px;
    }

    .stream-intro h1 {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }

    .stream-intro p {
      font-size: 18px;
      color: #7f8c8d;
      line-height: 1.7;
    }

    .stream-container {
      display: flex;
      gap: 30px;
      align-items: stretch;
      margin-top: 40px;
    }

    .stream-player {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stream-player iframe {
      width: 100%;
      height: 100%;
      border-radius: 15px;
      border: none;
    }

    .player-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      padding: 10px 15px;
      border-radius: 25px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(106, 17, 203, 0.3);
    }

    .player-overlay .username {
      color: #ffd93d;
    }

    .stream-chat {
      width: 350px;
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
      font-weight: bold;
      color: #2c3e50;
      font-size: 18px;
      text-align: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      border-radius: 20px 20px 0 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-message {
      margin-bottom: 12px;
      padding: 10px 15px;
      border-radius: 15px;
      opacity: 0;
      animation: fadeIn 0.3s ease-in forwards;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .chat-message.donation {
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }

    .chat-message.system {
      background: #fff3cd;
      color: #856404;
      border-color: #ffeaa7;
    }

    .chat-message.user {
      background: #d1ecf1;
      color: #0c5460;
      border-color: #bee5eb;
    }

    .chat-message.mod {
      background: #d4edda;
      color: #155724;
      border-color: #c3e6cb;
    }

    .chat-message.vip {
      background: linear-gradient(135deg, #f9ca24, #f0932b);
      color: white;
      border: none;
    }

    .message-author {
      font-weight: bold;
      margin-right: 8px;
    }

    .message-text {
      word-wrap: break-word;
    }

    .donation-amount {
      color: #ffd93d;
      font-size: 16px;
      margin-right: 8px;
      font-weight: bold;
    }

    .donate-suggest {
      margin-top: 8px;
      text-align: center;
    }

    .donate-btn {
      display: inline-block;
      padding: 6px 12px;
      background: linear-gradient(135deg, #ff7a1a, #b43f00);
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 15px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .donate-btn:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Адаптивность */
    @media (max-width: 1024px) {
      .stream-container {
        flex-direction: column;
      }

      .stream-chat {
        width: 100%;
        height: 400px;
      }

      .player-overlay {
        top: 15px;
        right: 15px;
        font-size: 12px;
        padding: 8px 12px;
      }
    }

    @media (max-width: 768px) {
      .stream-intro h1 {
        font-size: 36px;
      }

      .stream-intro p {
        font-size: 16px;
      }

      .stream-player {
        padding: 15px;
        min-height: 300px;
      }

      .chat-messages {
        padding: 15px;
        font-size: 13px;
      }

      .chat-message {
        padding: 8px 12px;
      }
    }

    /* Скрыть скроллбар чата */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(106, 17, 203, 0.3);
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(106, 17, 203, 0.5);
    }
  </style>
</head>
<body>
  <header id="main-header">
    <div class="logo">СайтСотика</div>
    <nav id="main-nav">
      <a href="/pages/main/" class="nav-link">Главная</a>
      <a href="/pages/about/" class="nav-link">Обо мне</a>
      <a href="#" class="nav-link" data-menu-action="open-games">Игры</a>
      <a href="/pages/stream/" class="nav-link active">Стрим</a>
      <a href="/pages/team/" class="nav-link">Команда</a>
      <a href="/pages/partners/" class="nav-link">Партнеры</a>
    </nav>
    <script src="/js/header.js"></script>
  </header>

  <div id="mobile-panel"></div>

  <section class="wb-section">
    <div class="wb-shell">
      <div class="stream-intro">
        <h1>Прямой Эфир</h1>
        <p>Присоединяйтесь к живому стриму! Смотрите геймплей, общайтесь в чате и поддерживайте стримера. Каждый зритель важен для нашего сообщества!</p>
      </div>

      <div class="stream-container">
        <!-- Twitch плеер -->
        <div class="stream-player">
          <!-- Плеер поверх плеера -->
          <div class="player-overlay">
            <span class="username">fsbsotik</span> на стриме
          </div>

          <!-- Twitch Embed -->
          <iframe
            id="twitch-player"
            height="100%"
            width="100%"
            frameborder="0"
            scrolling="no"
            allowfullscreen="true">
          </iframe>
        </div>

        <!-- Чат -->
        <div class="stream-chat">
          <div class="chat-header">
            💬 Чат стрима
          </div>
          <div class="chat-messages" id="chatMessages">
            <!-- Сообщения будут добавляться сюда -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Настройка Twitch плеера для работы на любом домене
    function setupTwitchPlayer() {
      const iframe = document.getElementById('twitch-player');
      const currentHost = window.location.hostname;

      // Для локального сервера используем localhost, для продакшена - реальный домен
      const parent = currentHost === 'localhost' || currentHost === '127.0.0.1' || currentHost === '' ?
        'localhost' : currentHost;

      // Устанавливаем src с правильным parent
      iframe.src = `https://player.twitch.tv/?channel=fsbsotik&parent=${parent}`;
    }

    // Запускаем настройку плеера при загрузке страницы
    document.addEventListener('DOMContentLoaded', setupTwitchPlayer);

    // Фейковые данные для чата
    const chatData = {
      users: [
        'Игрок123', 'СтримерФан', 'КрутойГеймер', 'ЛолКек', 'ПроГеймер',
        'Нубик', 'БоссИгры', 'Читер228', 'МегаФан', 'СуперИгрок',
        'ТопГеймер', 'ЭлитныйИгрок', 'МастерИгр', 'Легенда', 'Профи',
        'VIP_Игрок', 'Модератор', 'Админ', 'Стример', 'Зритель',
        'ФанатИгр', 'ГеймерПро', 'ИгровойБосс', 'ЧитерПро', 'НубПро',
        'КрутойЧитер', 'МегаЧитер', 'СуперЧитер', 'ЭлитныйЧитер', 'ТопЧитер'
      ],

      messages: [
        'Крутая игра!', 'GG WP!', 'Хорошо играет!', 'Отличный стрим!',
        'Поддерживаю!', 'Классный момент!', 'Лайк!', 'Согласен!',
        'Отлично!', 'Продолжай!', 'Супер!', 'Красавчик!',
        'Молодец!', 'Респект!', 'Топ!', 'Браво!', 'Идеально!',
        'Мастер-класс!', 'Легендарно!', 'Потрясающе!',
        'Вау!', 'Невероятно!', 'Фантастика!', 'Шедевр!',
        'Гениально!', 'Умница!', 'Профессионал!', 'Маэстро!',
        'Виртуоз!', 'Гуру!', 'Эксперт!', 'Ас!', 'Звезда!',
        'Чемпион!', 'Герой!', 'Лидер!', 'Босс!', 'Король!',
        'Император!', 'Бог!', 'Легенда!', 'Миф!', 'Сказка!',
        'Чудо!', 'Магия!', 'Волшебство!', 'Фейк!', 'Шоу!',
        'Спектакль!', 'Театр!', 'Кино!', 'Фильм!', 'Блокбастер!',
        'Хит!', 'Бестселлер!', 'Шедевр!', 'Классика!', 'Вечность!'
      ],

      donations: [
        { amount: 100, currency: 'RUB', message: 'Спасибо за стрим!' },
        { amount: 250, currency: 'RUB', message: 'Отличная игра!' },
        { amount: 500, currency: 'RUB', message: 'Поддержка стримера!' },
        { amount: 1000, currency: 'RUB', message: 'Топовый стрим!' },
        { amount: 50, currency: 'RUB', message: 'Молодец!' },
        { amount: 300, currency: 'RUB', message: 'GG WP!' },
        { amount: 750, currency: 'RUB', message: 'Легенда!' },
        { amount: 2000, currency: 'RUB', message: 'Супер стример!' },
        { amount: 150, currency: 'RUB', message: 'Круто!' },
        { amount: 400, currency: 'RUB', message: 'Респект!' }
      ],

      streamerThanks: [
        'Спасибо большое! Ребята, не стесняйтесь —',
        'Огромное спасибо! Друзья, если хотите поддержать проект —',
        'Благодарю от души! Всем зрителям напоминаю —',
        'Спасибо! Ребята, присоединяйтесь к поддержке —',
        'Огромное спасибо за поддержку! Друзья, если есть возможность —',
        'Благодарю! Напоминаю всем —',
        'Спасибо большое! Ребята, не забывайте про поддержку —',
        'Огромная благодарность! Друзья, поддержите стрим —',
        'Спасибо! Всем зрителям —',
        'Благодарю от всего сердца! Ребята, присоединяйтесь —',
        'Спасибо большое! Напоминаю —',
        'Огромное спасибо! Друзья, если хотите поддержать —',
        'Благодарю! Ребята, поддержка очень важна —',
        'Спасибо! Всем зрителям предлагаю —',
        'Огромная благодарность! Друзья, не стесняйтесь —'
      ]
    };

    // Элемент чата
    const chatMessages = document.getElementById('chatMessages');
    const maxMessages = 50; // Максимум сообщений в чате

    // Функция добавления сообщения
    function addMessage(msg) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `chat-message ${msg.type}`;

      let content = '';

      if (msg.type === 'donation') {
        content = `<span class="donation-amount">${msg.amount}${msg.currency}</span><span class="message-author">${msg.user}:</span> <span class="message-text">${msg.message}</span>`;
      } else if (msg.type === 'streamer') {
        content = `<span class="message-author streamer">fsbsotik:</span> <span class="message-text">${msg.message}</span>`;
      } else {
        const authorClass = msg.type === 'system' ? 'system' :
                           msg.type === 'mod' ? 'mod' :
                           msg.type === 'vip' ? 'vip' : 'user';
        content = `<span class="message-author ${authorClass}">${msg.user}:</span> <span class="message-text">${msg.message}</span>`;
      }

      messageDiv.innerHTML = content;
      chatMessages.appendChild(messageDiv);

      // Удаляем старые сообщения если их слишком много
      while (chatMessages.children.length > maxMessages) {
        chatMessages.removeChild(chatMessages.firstChild);
      }

      // Автопрокрутка вниз
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Функция создания обычного сообщения
    function createRegularMessage() {
      const user = chatData.users[Math.floor(Math.random() * chatData.users.length)];
      const message = chatData.messages[Math.floor(Math.random() * chatData.messages.length)];
      const messageType = Math.random() < 0.05 ? 'system' :
                         Math.random() < 0.1 ? 'mod' :
                         Math.random() < 0.15 ? 'vip' : 'user';

      return {
        type: messageType,
        user: user,
        message: message
      };
    }

    // Функция создания доната
    function createDonation() {
      const user = chatData.users[Math.floor(Math.random() * chatData.users.length)];
      const donation = chatData.donations[Math.floor(Math.random() * chatData.donations.length)];

      return {
        type: 'donation',
        user: user,
        amount: donation.amount,
        currency: donation.currency,
        message: donation.message,
        donor: user
      };
    }

    // Функция благодарности стримера с кнопкой доната
    function createStreamerThanks(donorName) {
      const thanks = chatData.streamerThanks[Math.floor(Math.random() * chatData.streamerThanks.length)];

      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message streamer';

      const content = `
        <span class="message-author streamer">fsbsotik:</span>
        <span class="message-text">
          ${thanks}
          <div class="donate-suggest">
            <a href="https://donate.stream/sotikdima" target="_blank" class="donate-btn">💰 Поддержать</a>
          </div>
        </span>
      `;
      messageDiv.innerHTML = content;
      return messageDiv;
    }

    // Основной цикл чата
    let lastDonationTime = 0;
    let messageCount = 0;

    function addNextMessage() {
      const now = Date.now();
      const timeSinceLastDonation = now - lastDonationTime;

      // Каждые 2 минуты (120000 мс) добавляем донат
      if (timeSinceLastDonation >= 120000) {
        const donation = createDonation();
        addMessage(donation);

        // Через 3-5 секунд стример благодарит и показывает кнопку
        setTimeout(() => {
          const thanksMessage = createStreamerThanks(donation.donor);
          chatMessages.appendChild(thanksMessage);

          // Удаляем старые сообщения и прокручиваем
          while (chatMessages.children.length > maxMessages) {
            chatMessages.removeChild(chatMessages.firstChild);
          }
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, Math.random() * 2000 + 3000); // 3-5 секунд

        lastDonationTime = now;
      } else {
        // Обычное сообщение каждые 30 секунд
        const message = createRegularMessage();
        addMessage(message);
      }

      messageCount++;
    }

    // Запуск чата
    setTimeout(addNextMessage, 1000); // Первое сообщение через 1 сек

    // Добавляем новые сообщения каждые 30 секунд
    setInterval(addNextMessage, 30000);

    // Обработка ошибок плеера
    window.addEventListener('error', function(e) {
      console.log('Twitch player error:', e);
    });

    // Адаптивность
    function handleResize() {
      const isMobile = window.innerWidth <= 768;
      const chat = document.querySelector('.stream-chat');

      if (isMobile) {
        chat.style.height = '300px';
      } else {
        chat.style.height = 'auto';
      }
    }

    window.addEventListener('resize', handleResize);
    handleResize(); // Инициализация
  </script>
</body>
</html>
