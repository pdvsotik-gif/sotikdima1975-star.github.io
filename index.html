<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>СайтСотика</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      cursor: none;
    }
    
    .cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
    }
    
    .title {
      font-size: 5em;
      font-weight: bold;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #007acc;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .subtitle {
      font-size: 1.5em;
      margin-bottom: 40px;
      font-weight: 300;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .instruction {
      font-size: 1em;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://source.unsplash.com/random/1920x1080/?race,cars') center/cover no-repeat;
      z-index: -1;
      opacity: 0;
    }
    
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent, transparent 50%, rgba(255,255,255,0.05) 50%, transparent 51%);
      background-size: 100% 4px;
      z-index: 99;
      pointer-events: none;
    }
    
    .glitch-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 98;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 122, 204, 0.05),
        rgba(0, 122, 204, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0;
    }
    
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid #007acc;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.2s, height 0.2s;
    }
    
    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      background: rgba(0, 122, 204, 0.2);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes glitch {
      0% { opacity: 0; }
      2% { opacity: 1; }
      4% { opacity: 0; }
      6% { opacity: 1; }
      8% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; }
    }
    
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    
    .float-animation {
      animation: float 6s ease-in-out infinite;
    }
    
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #007acc;
      border-radius: 50%;
      opacity: 0;
    }
    
    .fade-in {
      animation: fadeIn 1s ease-out forwards;
    }
    
    .fade-in-delay-1 {
      animation: fadeIn 1s ease-out 0.2s forwards;
    }
    
    .fade-in-delay-2 {
      animation: fadeIn 1s ease-out 0.4s forwards;
    }
    
    .glitch-animation {
      animation: glitch 3s ease-out 1s forwards;
    }
  </style>
</head>
<body>
  <div class="background" id="background"></div>
  <div class="scanline"></div>
  <div class="glitch-effect" id="glitch"></div>
  
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursor-follower"></div>
  
  <div class="cover" id="cover">
    <h1 class="title" id="title">СайтСотика</h1>
    <p class="subtitle" id="subtitle">Стример гоночных игр</p>
    <p class="instruction" id="instruction">Нажмите любую клавишу для входа</p>
  </div>

  <script>
    // Анимация появления
    window.addEventListener('load', function() {
      setTimeout(() => {
        document.getElementById('background').classList.add('fade-in');
        
        setTimeout(() => {
          document.getElementById('title').classList.add('fade-in');
          
          setTimeout(() => {
            document.getElementById('subtitle').classList.add('fade-in');
            
            setTimeout(() => {
              document.getElementById('instruction').classList.add('fade-in');
              
              // Случайная анимация глитча
              setTimeout(() => {
                document.getElementById('glitch').classList.add('glitch-animation');
              }, 2000);
            }, 200);
          }, 200);
        }, 200);
      }, 500);
    });
    
    // Создание частиц
    function createParticles() {
      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      container.style.zIndex = '97';
      document.body.appendChild(container);
      
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          
          // Случайные параметры
          const size = Math.random() * 3 + 1;
          const xPos = Math.random() * 100;
          const yPos = Math.random() * 100;
          const duration = Math.random() * 10 + 5;
          const delay = Math.random() * 5;
          
          // Стили
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = `${xPos}%`;
          particle.style.top = `${yPos}%`;
          particle.style.opacity = '0';
          
          container.appendChild(particle);
          
          // Анимация появления
          setTimeout(() => {
            particle.style.transition = 'opacity 0.5s ease-out';
            particle.style.opacity = '0.7';
            
            // Анимация движения
            setTimeout(() => {
              particle.style.transition = `all ${duration}s ease-out ${delay}s`;
              particle.style.transform = `translate(${Math.random() * 100 - 50}px, -100px)`;
              particle.style.opacity = '0';
              
              // Удаление через некоторое время
              setTimeout(() => {
                if (particle.parentNode) {
                  particle.parentNode.removeChild(particle);
                }
              }, duration * 1000 + delay * 1000 + 1000);
            }, 500 + Math.random() * 2000);
          }, i * 50);
        }, i * 100);
      }
    }
    
    // Запуск анимации частиц
    setTimeout(createParticles, 2000);
    setInterval(createParticles, 8000);
    
    // Кастомный курсор
    const cursor = document.getElementById('cursor');
    const cursorFollower = document.getElementById('cursor-follower');
    
    document.addEventListener('mousemove', function(e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      
      cursorFollower.style.left = e.clientX + 'px';
      cursorFollower.style.top = e.clientY + 'px';
    });
    
    document.addEventListener('mousedown', function() {
      cursor.style.transform = 'translate(-50%, -50%) scale(0.8)';
      cursorFollower.style.width = '30px';
      cursorFollower.style.height = '30px';
    });
    
    document.addEventListener('mouseup', function() {
      cursor.style.transform = 'translate(-50%, -50%) scale(1)';
      cursorFollower.style.width = '40px';
      cursorFollower.style.height = '40px';
    });
    
    // Переход по нажатию любой клавиши
    document.addEventListener('keydown', function(e) {
      enterSite();
    });
    
    document.addEventListener('click', function(e) {
      enterSite();
    });
    
    function enterSite() {
      // Удаление всех анимированных элементов
      document.querySelectorAll('.particle').forEach(p => {
        if (p.parentNode) {
          p.parentNode.removeChild(p);
        }
      });
      
      const cover = document.getElementById('cover');
      cover.style.transition = 'opacity 0.8s ease-out';
      cover.style.opacity = '0';
      
      // Анимация выхода
      setTimeout(() => {
        window.location.href = 'pages/main/index.html';
      }, 800);
    }
    
    // Эффекты при наведении на инструкцию
    const instruction = document.getElementById('instruction');
    instruction.addEventListener('mouseover', function() {
      this.style.transform = 'translateY(-5px)';
      this.style.transition = 'transform 0.3s ease';
    });
    
    instruction.addEventListener('mouseout', function() {
      this.style.transform = 'translateY(0)';
    });
  </script>
</body>
</html>
