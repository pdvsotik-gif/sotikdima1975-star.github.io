<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>СайтСотика — Премиум Обложка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e27;
      color: #fff;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      cursor: none;
    }

    /* === ФОНОВАЯ СИСТЕМА === */
    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridFlow 20s linear infinite;
    }

    @keyframes gridFlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.3;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: float 8s ease-in-out infinite;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      bottom: 100px;
      left: -50px;
      animation: float 10s ease-in-out infinite 2s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: float 12s ease-in-out infinite 4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }

    /* === КАСТОМНЫЙ КУРСОР === */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease-out;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .cursor-dot {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #3b82f6;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.8);
    }

    /* === ОСНОВНОЙ КОНТЕНТ === */
    .content {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
    }

    .logo-box {
      position: relative;
      margin-bottom: 60px;
    }

    .logo-ring {
      width: 180px;
      height: 180px;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spinRing 8s linear infinite;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
    }

    .logo-ring::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed #ec4899;
      border-radius: 50%;
      animation: spinRingReverse 6s linear infinite;
      top: 0;
      left: 0;
    }

    @keyframes spinRing {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spinRingReverse {
      from { transform: rotate(-360deg); }
      to { transform: rotate(0deg); }
    }

    .title-main {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6 0%, #ec4899 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 20px;
      animation: titlePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes titlePop {
      from {
        opacity: 0;
        transform: scale(0.5) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .subtitle-text {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeInUp 1s ease-out 0.3s forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cta-button {
      padding: 16px 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 2px solid #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease-out;
      animation: fadeInUp 1s ease-out 0.6s forwards;
      opacity: 0;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease-out;
    }

    .cta-button:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: #ec4899;
      color: #ec4899;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5), 0 0 30px rgba(236, 72, 153, 0.3);
    }

    .cta-button:hover::before {
      left: 100%;
    }

    .cta-button:active {
      transform: translateY(-1px);
    }

    /* === ИНТЕРАКТИВНЫЕ ЭЛЕМЕНТЫ === */
    .floating-cards {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .card {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      opacity: 0.4;
      transition: all 0.3s ease-out;
    }

    .card:hover {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.1);
      opacity: 0.8;
      transform: scale(1.1) rotate(5deg);
    }

    /* === СТАТИСТИКА === */
    .stats-panel {
      position: fixed;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 30px;
      z-index: 20;
      animation: fadeInUp 1s ease-out 0.8s forwards;
      opacity: 0;
    }

    .stat-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 20px 25px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(10px);
      min-width: 120px;
      transition: all 0.3s ease-out;
    }

    .stat-box:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: #ec4899;
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .title-main {
        font-size: 2.5rem;
      }

      .subtitle-text {
        font-size: 1rem;
      }

      .stats-panel {
        bottom: 20px;
        right: 20px;
        gap: 15px;
      }

      .stat-box {
        padding: 15px 20px;
        min-width: 100px;
      }

      .logo-ring {
        width: 120px;
        height: 120px;
      }

      .card {
        width: 70px;
        height: 70px;
        font-size: 2rem;
      }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <link rel="stylesheet" href="/css/records.css">
</head>
<body>
<!-- Фон -->
<div class="hero-bg">
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
</div><!-- Плавающие карточки -->
<div class="floating-cards" id="floatingCards"></div><!-- Основной контент -->
<div class="content">
  <div class="logo-box">
    <div class="logo-ring"></div>
  </div>
  <h1 class="title-main">СайтСотика</h1>
  <p class="subtitle-text">Ultimate Racing Experience</p><button class="cta-button" onclick="handleEnter()">Войти</button>
</div><!-- Статистика -->
<div class="stats-panel">
  <div class="stat-box">
    <div class="stat-number" id="stat-speed">
      0
    </div>
    <div class="stat-label">
      Speed
    </div>
  </div>
  <div class="stat-box">
    <div class="stat-number" id="stat-rank">
      ∞
    </div>
    <div class="stat-label">
      Rank
    </div>
  </div>
  <div class="stat-box">
    <div class="stat-number" id="stat-level">
      LVL
    </div>
    <div class="stat-label">
      Status
    </div>
  </div>
</div><!-- Кастомный курсор -->
<div class="custom-cursor"></div>
<div class="cursor-dot"></div>
<script>
  // === КАСТОМНЫЙ КУРСОР ===
  const cursor = document.querySelector('.custom-cursor');
  const dot = document.querySelector('.cursor-dot');
  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;

    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
  });

  // === ПЛАВАЮЩИЕ КАРТОЧКИ ===
  const icons = ['🏎️', '⚡', '🏁', '💨', '🔥', '🎯'];
  const container = document.getElementById('floatingCards');

  icons.forEach((icon, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = icon;
    card.style.left = Math.random() * 80 + '%';
    card.style.top = Math.random() * 80 + '%';
    card.style.animation = `float ${6 + i}s ease-in-out infinite`;
    card.style.animationDelay = (i * 0.5) + 's';
    container.appendChild(card);
  });

  // === АНИМИРОВАННЫЕ СТАТИСТИКИ ===
  let speed = 0;
  setInterval(() => {
    speed = (speed + Math.random() * 15) % 999;
    document.getElementById('stat-speed').textContent = Math.floor(speed);
  }, 200);

  const levels = ['ZERO', 'ULTRA', 'ELITE', 'KING', 'LEGEND'];
  let levelIndex = 0;
  setInterval(() => {
    levelIndex = (levelIndex + 1) % levels.length;
    document.getElementById('stat-level').textContent = levels[levelIndex];
  }, 3000);

  // === ОБРАБОТЧИК ВХОДА ===
  function handleEnter() {
    document.querySelector('.title-main').style.animation = 'titlePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) reverse forwards';
    setTimeout(() => {
      window.location.href = 'pages/main/';
    }, 600);
  }

  // Загружаем рекорды после полной загрузки страницы
  window.addEventListener('load', loadSotikRecords);

  // === ЧАСТИЦЫ НА КЛИК ===
  document.addEventListener('click', (e) => {
    for (let i = 0; i < 5; i++) {
      const particle = document.createElement('div');
      particle.style.position = 'fixed';
      particle.style.left = e.clientX + 'px';
      particle.style.top = e.clientY + 'px';
      particle.style.width = '8px';
      particle.style.height = '8px';
      particle.style.background = `hsl(${Math.random() * 60 + 180}, 100%, 60%)`;
      particle.style.borderRadius = '50%';
      particle.style.pointerEvents = 'none';
      particle.style.zIndex = '9997';
      particle.style.boxShadow = `0 0 15px ${particle.style.background}`;
      document.body.appendChild(particle);

      const angle = (Math.PI * 2 * i) / 5;
      const velocity = { x: Math.cos(angle) * 5, y: Math.sin(angle) * 5 };
      const startTime = Date.now();

      const animate = () => {
        const elapsed = Date.now() - startTime;
        particle.style.left = (parseFloat(e.clientX) + velocity.x * (elapsed / 50)) + 'px';
        particle.style.top = (parseFloat(e.clientY) + velocity.y * (elapsed / 50)) + 'px';
        particle.style.opacity = Math.max(0, 1 - elapsed / 1000);

        if (elapsed < 1000) {
          requestAnimationFrame(animate);
        } else {
          particle.remove();
        }
      };
      animate();
    }
  });
</script>
</body>
</html>
